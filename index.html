<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <style>
        body {
            background: #14141f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            background: #1f1f30;
            padding: 30px;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
        }

        img.avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4da6ff;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="conbo.jpg" alt="Ảnh của tôi" class="avatar">
        <h2>Xin chào!</h2>
        <p>Trang web đầu tiên của mình.</p>
    </div>
</body>
</html>
